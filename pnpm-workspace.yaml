# Nuxt 4.6.1 was installed inside pnpm's 24h release-age cooldown (published
# 2026-10-09). Version-pinned, so it exempts nothing newer — safe to delete.
minimumReleaseAgeExclude:
  - nuxt@4.6.1
  - '@nuxt/kit@4.6.1'
  - '@nuxt/schema@4.6.1'
  - '@nuxt/nitro-server@4.6.1'
  - '@nuxt/vite-builder@4.6.1'
  - '@nuxt/vite-server@4.6.1'

allowBuilds:
  '@parcel/watcher': false
  '@tailwindcss/oxide': false
  esbuild: false
  unrs-resolver: false
  vue-demi: false
